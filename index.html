@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap');
/* \u2500\u2500 Sistema de dise\xF1o: "cancha dura" \u2500\u2500
   Fondo claro para leerse bien al sol en la cancha; azul de cancha como color de marca;
   arcilla solo para derrotas/alertas, verde para victorias/bien, \xE1mbar para precauci\xF3n. */
:root{
  --paper:#ECF0F2;--card:#FFFFFF;--ink:#0F2233;--muted:#5A6B79;--faint:#8A97A3;--line:#D8E0E5;--line2:#E8EDF0;
  --court:#1F5A8A;--court-deep:#163F63;--court-tint:#E3ECF4;--ball:#DCE65A;
  --ok:#2C7A55;--ok-tint:#E2F1E8;--warn:#B7800F;--warn-tint:#FBF0D6;--bad:#C2552B;--bad-tint:#F9E5DC;
  --r-sm:6px;--r:10px;--r-lg:16px;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif;
  /* alias usados dentro de la app */
  --bg:var(--paper);--bg2:var(--card);--chalk:var(--ink);--clay:var(--bad);--clay-l:var(--bad);--gold:var(--warn);--green:var(--ok);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);-webkit-tap-highlight-color:transparent}
.screen{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;min-height:100vh}
.screen.app{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Carga */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100vh;padding:20px;text-align:center}
.loader-dot{width:12px;height:12px;border-radius:50%;background:var(--ball);box-shadow:0 0 0 2px var(--court);animation:bounce .9s infinite ease-in-out}
.loader-txt{font-size:14px;color:var(--muted)}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* Acceso */
.auth-wrap{font-family:var(--body);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:var(--court);position:relative;overflow:hidden;padding:0 0 24px}
.auth-court{position:absolute;left:0;right:0;top:6%;width:100%;height:46%;color:rgba(255,255,255,.3);pointer-events:none}
.auth-box{position:relative;background:var(--card);border-radius:var(--r-lg);padding:26px 22px 22px;width:min(420px,calc(100vw - 32px));box-shadow:0 18px 40px rgba(8,25,40,.25)}
.auth-logo{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em;color:var(--ink)}
.auth-tag{font-size:14px;color:var(--muted);margin:6px 0 18px;max-width:34ch}
.auth-tabs{display:flex;background:var(--paper);border-radius:var(--r);padding:3px;margin-bottom:16px}
.auth-tab{flex:1;background:transparent;border:none;font-weight:600;font-size:14px;color:var(--muted);padding:9px;border-radius:8px;cursor:pointer}
.auth-tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,34,51,.12)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form .btn-primary{align-self:stretch;margin-top:4px}
.auth-err{background:var(--bad-tint);color:#8E3A19;padding:9px 12px;border-radius:var(--r-sm);font-size:13.5px}

/* Encabezado */
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(236,240,242,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line2)}
.hdr-who{display:flex;align-items:center;gap:11px;flex:1;min-width:0;cursor:pointer}
.hdr-avatar{width:40px;height:40px;border-radius:50%;background:var(--court);color:#fff;font-family:var(--display);font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;object-fit:cover}
.hdr-hi{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub::first-letter{text-transform:uppercase}
.hdr-out{background:none;border:none;font-size:13.5px;font-weight:600;color:var(--muted);padding:8px 4px;cursor:pointer}
.hdr-back{background:var(--card);border:1px solid var(--line);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* Navegaci\xF3n inferior */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;color:var(--faint);font-size:11.5px;font-weight:600;cursor:pointer;position:relative}
.bottom-nav button.on{color:var(--court)}
.bottom-nav button.on::before{content:"";position:absolute;top:-7px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--court)}
.seg{display:flex;background:var(--line2);border-radius:var(--r);padding:3px;margin-bottom:16px;position:sticky;top:66px;z-index:10}
.seg button{flex:1;background:none;border:none;padding:8px 6px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,34,51,.12)}

.content{padding:16px;max-width:760px;margin:0 auto}
.tab-body{display:flex;flex-direction:column;gap:14px}

/* Botones */
.btn-primary{align-self:flex-start;background:var(--court);color:#fff;border:none;min-height:44px;padding:10px 18px;border-radius:var(--r);font-weight:600;font-size:15px;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:var(--court-deep)}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:13px;padding:7px 12px;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}
.btn-ghost:hover{border-color:var(--court)}
.btn-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;font-weight:500;margin-left:auto;padding:4px}
.btn-del:hover{color:var(--bad)}
.del-confirm{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-size:13.5px;font-weight:600}
.btn-danger{background:var(--bad);color:#fff;border:none;font-weight:600;font-size:13px;padding:7px 12px;border-radius:var(--r-sm);cursor:pointer}
.link{background:none;border:none;color:var(--court);font-weight:600;font-size:14px;cursor:pointer;padding:6px 0;text-align:left}
.btn-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;border-radius:var(--r);border:1.5px dashed #9CB4C9;background:transparent;color:var(--court);font-weight:600;font-size:15px;cursor:pointer}
.btn-add:hover{background:var(--court-tint)}
.btn-ai{background:var(--ink);color:#fff;border:none;font-weight:600;font-size:13px;padding:8px 14px;border-radius:var(--r-sm);cursor:pointer}
.btn-ai:disabled{opacity:.5;cursor:default}
.btn-report{background:var(--court-tint);border:none;color:var(--court);font-weight:600;font-size:12.5px;padding:6px 10px;border-radius:var(--r-sm);cursor:pointer}
.btn-report:disabled{opacity:.5}
.btn-upload,.btn-unlink{background:var(--card);border:1px solid var(--line);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:var(--r-sm);cursor:pointer}
.btn-unlink{color:var(--bad)}
.ai-date{font-size:12px;color:var(--faint)}

/* Formularios */
.entry-form{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line2)}
.add-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.fl{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--paper);border:1px solid transparent;color:var(--ink);padding:10px 11px;border-radius:var(--r-sm);font-family:var(--body);font-size:15px;outline:none;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--court);background:#fff}
textarea{resize:vertical;line-height:1.45}
.mol-wrap{display:flex;flex-direction:column;gap:10px}
.period{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.period::-webkit-scrollbar{display:none}
.period button,.chips button{flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 13px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.period button.on,.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.prog{display:flex;flex-direction:column;gap:14px}
.prog-rec{display:grid;grid-template-columns:1.1fr 1.3fr .8fr;gap:8px;border-bottom:1px solid var(--line2);padding-bottom:10px}
.prog-rec div{display:flex;flex-direction:column}
.prog-rec strong{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.prog-rec span{font-size:12.5px;color:var(--muted)}
.num-rows{display:flex;flex-direction:column}
.num-row{display:grid;grid-template-columns:1fr auto 64px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2);font-size:14px}
.num-row:first-child{border-top:none}
.num-v{font-family:var(--display);font-weight:600;font-size:19px;text-align:right}
.delta{font-size:12px;font-weight:700;text-align:right;white-space:nowrap}
.delta.good{color:var(--ok)}.delta.bad{color:var(--bad)}.delta.eq{color:var(--faint)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr 44px;align-items:center;gap:10px}
.bar-l{display:flex;flex-direction:column;min-width:0}
.bar-l span{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-l small{font-size:12px;color:var(--muted)}
.bar-track{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}
.bar-track span{display:block;height:100%;border-radius:5px}
.bar-track span.good{background:var(--ok)}.bar-track span.bad{background:var(--bad)}
.bar-row strong{font-family:var(--display);font-weight:600;font-size:18px;text-align:right}
.wcols{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:2px}
.wcol{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:34px;flex:1}
.wcol-v{font-size:12px;font-weight:700}
.wcol-bar{height:90px;width:18px;background:var(--line2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.wcol-bar i{display:block;width:100%;border-radius:5px}
.wcol-bar i.good{background:var(--ok)}.wcol-bar i.mid{background:#E8B23A}.wcol-bar i.bad{background:var(--bad)}
.wcol small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.ready{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line2);padding-top:10px}
.ready div{display:flex;flex-direction:column}
.ready strong{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.ready span{font-size:12.5px;color:var(--muted)}
.heat{display:flex;justify-content:center;gap:18px}
.heat-fig{display:flex;flex-direction:column;align-items:center;gap:4px}
.heat-svg{width:96px;height:auto}
.heat-fig small{font-size:12px;color:var(--muted)}
.mol-top{display:flex;flex-direction:column}
.mol-top div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line2);font-size:14px}
.report{display:flex;flex-direction:column;gap:14px}
.block.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rep-grid div{display:flex;flex-direction:column}
.rep-grid span{font-size:12.5px;color:var(--muted);font-weight:600}
.rep-grid strong{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05}
.rep-grid small{font-size:12px;color:var(--muted)}
.rep-actions{display:flex;gap:10px;flex-wrap:wrap}
.print-only{display:none}
.report-title{font-family:var(--display);font-weight:700;font-size:26px}
@media print{.hdr,.bottom-nav,.seg,.no-print,.upd-banner,.toast{display:none!important}.print-only{display:block}.screen.app{padding-bottom:0}.block{break-inside:avoid;border:1px solid #ccc}body,.screen{background:#fff}}
.frac{display:flex;align-items:center;gap:6px}
.frac input{flex:1;min-width:0;text-align:center}
.frac span{font-weight:700;color:var(--muted)}
.frac em{font-style:normal;font-weight:700;font-size:13.5px;color:var(--court);min-width:46px;text-align:right}
.frac-row{grid-template-columns:1fr}
@media (min-width:640px){.frac-row{grid-template-columns:1fr 1fr}}
.frac input{max-width:110px}
.rpe-btns{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe-btns button{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-family:var(--display);font-weight:600;font-size:17px;cursor:pointer;padding:0}
.rpe-btns button.on{color:#fff;border-color:transparent;background:var(--warn);background:color-mix(in srgb,var(--bad) calc(var(--lv)*100%),var(--ok))}
.dur-pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dur-pick button{min-height:40px;padding:0 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;cursor:pointer}
.dur-pick button.on{background:var(--court);border-color:var(--court);color:#fff}
.dur-pick input{width:80px;min-height:40px;text-align:center}
.type-pick{display:flex;gap:6px;flex-wrap:wrap}
.type-pick button{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer}
.type-pick button.on{background:var(--tc);border-color:var(--tc);color:var(--tcon,#fff)}
.quick{display:flex;flex-direction:column;gap:12px;background:var(--paper);border-radius:var(--r);padding:12px}
.log-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.log-row:first-of-type{border-top:none}
.log-row.ok .today-title{color:var(--ok)}
.ok-txt{color:var(--ok)!important;font-weight:600}
.plan-rpe{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.type-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.type-legend span{display:inline-flex;align-items:center;gap:5px}
.type-legend i{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.tw{gap:12px}
.tw-tot{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.tw-tot span{display:inline-flex;align-items:center;gap:5px}
.tw-tot i{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.tw-tot strong{color:var(--ink)}
.tw-sum{margin-left:auto}
.tw-days{display:flex;flex-direction:column}
.tw-day{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line2)}
.tw-day:first-child{border-top:none}
.tw-day.today .tw-label strong{background:var(--ball);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.tw-label{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);text-transform:capitalize}
.tw-label strong{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.2;color:var(--ink)}
.tw-items{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.tw-empty{font-size:13px;color:var(--faint)}
.tw-chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;background:color-mix(in srgb,var(--tc) 14%,#fff);color:var(--tci,var(--tc));border-left:3px solid var(--tc)}
.tw-chip.plan{background:transparent;border:1.5px dashed var(--tc);color:var(--muted)}
.tw-chip.missed{border-color:var(--bad);color:var(--bad)}
.tw-chip em{font-style:normal;font-weight:500;font-size:11.5px;opacity:.8}
.calc{font-size:12.5px;font-weight:600;color:var(--court)}
.scale7{display:flex;flex-direction:column;gap:7px}
.scale7-btns{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.scale7-btns button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--display);font-weight:600;font-size:20px;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
.scale7-btns button.on{color:#fff;border-color:transparent;background:var(--ok);background:color-mix(in srgb,var(--bad) calc(var(--lv)*100%),var(--ok))}
.scale7-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.mol-q{display:flex;flex-direction:column;gap:7px}
.body-pick{display:flex;flex-direction:column;gap:10px;border:1.5px dashed #B9C6D1;border-radius:var(--r);padding:12px}
.seg-sm{position:static;margin:0}
.body-sides{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);width:min(100%,240px);align-self:center}
.body-svg{width:min(100%,170px);height:auto;align-self:center;touch-action:manipulation}
.bp{fill:#C9D3DB;stroke:#fff;stroke-width:1.5;cursor:pointer;transition:fill .12s}
.bp:hover{fill:#B4C1CC}
.bp.sel{stroke:var(--court);stroke-width:2.5}
.bp.pend{stroke:var(--court);stroke-width:2.5;stroke-dasharray:4 3;fill:#AFC4D6}
.body-edit-btns{display:flex;gap:8px}.body-edit-btns>*{flex:1}
.body-hint{font-size:13px;color:var(--muted);text-align:center}
.body-chips{display:flex;flex-wrap:wrap;gap:6px}
.body-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 6px 5px 10px;font-size:13px;font-weight:600;cursor:pointer}
.body-chip.on{border-color:var(--court);background:var(--court-tint)}
.body-chip i{width:9px;height:9px;border-radius:50%}
.body-chip-x{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.body-chip-x:hover{background:var(--line2);color:var(--bad)}
textarea{resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;min-height:44px}
.tr-groups{display:flex;flex-direction:column;gap:10px}
.tr-group{background:var(--card);border-radius:var(--r-sm);border-left:5px solid var(--tc);overflow:hidden}
.tr-group-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 14px;background:none;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tr-group-h i{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none}
.tr-group-h b{font-family:var(--display);font-size:19px;font-weight:600}
.tr-group-h span{flex:1;color:var(--muted);font-size:13px}
.tr-group-h em{font-style:normal;font-weight:700;font-size:13px;color:var(--court)}
.tr-group .rec-list{padding:0 10px 10px}
.dpick{position:relative}
.dpick-btn{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper);font:inherit;font-size:16px;color:inherit;cursor:pointer;text-align:left;text-transform:capitalize}
.dpick-btn.empty{color:var(--muted);text-transform:none}
.dpick-pop{margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;box-shadow:0 8px 24px rgba(20,40,60,.12)}
.dpick-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dpick-head b{font-family:var(--display);font-size:18px;font-weight:600;text-transform:capitalize}
.dpick-head button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;cursor:pointer}
.dpick-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dpick-dow{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.dpick-grid button{height:40px;border-radius:8px;border:0;background:none;font:inherit;font-size:15px;font-weight:600;cursor:pointer;color:inherit}
.dpick-grid button.today{box-shadow:inset 0 0 0 1.5px var(--court)}
.dpick-grid button.on{background:var(--court);color:#fff}
.dpick-foot{display:flex;justify-content:space-between;margin-top:6px}
.med-open{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-top:4px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:left;font:inherit;color:inherit}
.med-open b{display:block;font-family:var(--display);font-size:18px;font-weight:600}
.med-open small{color:var(--muted);font-size:13px}
.med-open>div{flex:1}
.med-ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;font-size:18px;flex:none}
.med-arrow{font-size:26px;color:var(--muted)}
.med-sec{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.med-sec:last-child{border-bottom:0;margin-bottom:0}
.med-h{font-family:var(--display);font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.med-h span{font-size:13px;font-family:inherit;background:var(--paper);border-radius:10px;padding:2px 8px;color:var(--muted)}
.inj-list{display:flex;flex-direction:column;gap:8px}
.inj-card{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);font:inherit;color:inherit;cursor:pointer}
.inj-card:disabled{cursor:default;opacity:1}
.inj-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.inj-top b{font-size:16px}
.inj-st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap}
.inj-st.ok{background:color-mix(in srgb,var(--ok) 14%,#fff);color:var(--ok)}
.inj-st.warn{background:#FFF1D6;color:#8A5A00}
.inj-st.bad{background:color-mix(in srgb,var(--bad) 14%,#fff);color:var(--bad)}
.inj-diag{font-size:14.5px}
.inj-meta{font-size:13px;color:var(--muted)}
.inj-form{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:var(--r-sm);padding:12px}
.inj-old{background:var(--paper);border-radius:var(--r-sm);padding:10px 12px}
.inj-old p{margin:4px 0 0;white-space:pre-wrap;font-size:14px}
.btn-ghost.danger{color:var(--bad)}
.inj-form input,.inj-form select,.inj-form textarea{background:var(--card)}
.ex-box{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.ex-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex-photo{cursor:pointer}
.ex-prev{width:52px;height:52px;object-fit:cover;border-radius:8px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px}
.ex-item img{width:84px;height:84px;object-fit:cover;border-radius:8px;flex:none;cursor:zoom-in}
.ex-txt{flex:1;display:flex;flex-direction:column;gap:2px;font-size:14px}
.ex-txt b{font-size:15px}
.ex-txt span{color:var(--muted)}
.ex-txt a{color:var(--court);font-weight:700;font-size:13.5px}
.inj-view{display:flex;flex-direction:column;gap:6px}
.inj-vt{font-family:var(--display);font-size:20px;font-weight:600}
.inj-ex-n{font-size:13px;font-weight:600;color:var(--court);margin-top:2px}
.photo-full{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:200;padding:16px}
.photo-full img{max-width:100%;max-height:100%;border-radius:8px}
.doc-zone{display:flex;flex-direction:column;gap:6px}
.doc-zone-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.doc-item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.chk input{width:20px;height:20px}
.body-edit{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:var(--r-sm);padding:12px}
.body-edit-t{font-family:var(--display);font-weight:600;font-size:18px}
.int-btns{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.int-btns button{min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer;padding:0}
.int-btns button.on{color:#fff}

.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;cursor:pointer}
.yn button.on{background:var(--court);border-color:var(--court);color:#fff}
.form-hint{font-size:13px;color:var(--muted)}

.section-label{font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink);padding-top:6px;border-top:1px solid var(--line2);margin-top:2px}
.section-label:first-child{border-top:none;padding-top:0;margin-top:0}
.ficha-title{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1}
.empty-note{font-size:14px;color:var(--muted);padding:4px 0}
.empty-note.centered{text-align:center;padding:28px 12px}
.log-latest{font-size:13.5px;color:var(--muted)}
.log-latest strong{color:var(--ink)}
.modal-toggle{display:flex;background:var(--paper);border-radius:var(--r);padding:3px}
.modal-opt{flex:1;padding:9px 0;background:transparent;border:none;font-weight:600;font-size:15px;color:var(--muted);border-radius:8px;cursor:pointer}
.modal-opt.on{background:var(--court);color:#fff}

/* Hoy */
.hoy{display:flex;flex-direction:column;gap:14px}
.hero{position:relative;overflow:hidden;background:var(--court);color:#fff;border-radius:var(--r-lg);padding:18px 18px 18px}
.hero.s-amarillo{background:#6B5A1E}
.hero.s-rojo{background:#7E3418}
.hero-court{position:absolute;right:-60px;top:-20px;width:300px;height:180px;color:rgba(255,255,255,.14);pointer-events:none}
.hero-top{position:relative;display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.hero-main{position:relative;display:flex;align-items:baseline;gap:6px;margin:4px 0 2px}
.hero-num{font-family:var(--display);font-weight:700;font-size:68px;line-height:.95;letter-spacing:-.01em}
.hero-of{font-family:var(--display);font-size:22px;opacity:.7}
.hero-state{margin-left:auto;align-self:center;font-weight:700;font-size:14px;background:var(--ball);color:var(--ink);padding:4px 10px;border-radius:20px}
.hero-state.solo{margin-left:0;font-size:15px}
.hero.s-amarillo .hero-state{background:#F4C75A}
.hero.s-rojo .hero-state{background:#FFB59A}
.hero-sub{position:relative;font-size:14px;line-height:1.45;opacity:.92;max-width:46ch}
.hero-cta{position:relative;margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:600;font-size:14px;padding:9px 14px;border-radius:var(--r-sm);cursor:pointer}
.hero-cta:hover{background:rgba(255,255,255,.22)}
.block{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.block-h h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1}
.cap{font-size:12.5px;color:var(--muted)}
.cap::first-letter{text-transform:uppercase}
.quiet{font-size:14px;color:var(--muted)}
.today-list{display:flex;flex-direction:column}
.today-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2)}
.today-item:first-child{border-top:none;padding-top:2px}

.today-title{font-weight:600;font-size:15.5px}
.today-notes{font-size:13.5px;color:var(--muted);margin-top:2px;white-space:pre-wrap}
.rank-strip{display:flex;align-items:flex-end;gap:0;padding:2px 4px;flex-wrap:wrap}
.rank-strip>div{display:flex;flex-direction:column;padding:0 16px 0 0;margin-right:16px;border-right:1px solid var(--line)}
.rank-strip>div:last-of-type{border-right:none}
.rank-strip span{font-size:12px;font-weight:600;color:var(--muted)}
.rank-strip strong{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.rank-strip em{font-style:normal;font-size:12px;color:var(--faint);margin-left:auto;align-self:flex-end;padding-bottom:4px}
.streak{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px}
.streak.w{background:var(--ok-tint);color:var(--ok)}
.streak.l{background:var(--bad-tint);color:var(--bad)}
.season{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.season-rec strong{display:block;font-family:var(--display);font-weight:700;font-size:56px;line-height:.9}
.season-rec i{font-style:normal;color:var(--faint);margin:0 2px}
.season-rec span{font-size:13px;color:var(--muted)}
.season-kv{display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);padding-left:16px}
.season-kv div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.season-kv dt{color:var(--muted)}
.season-kv dd{font-weight:600;text-align:right}
.score-list{display:flex;flex-direction:column;margin-top:4px}
.score-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.score-res{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;flex-shrink:0}
.score-row.w .score-res{background:var(--ok-tint);color:var(--ok)}
.score-row.l .score-res{background:var(--bad-tint);color:var(--bad)}
.score-main{flex:1;min-width:0}
.score-main div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-main small{font-size:12.5px;color:var(--muted)}
.score-num{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.well-rows{display:flex;flex-direction:column}
.well-row{display:grid;grid-template-columns:1fr 96px 64px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line2);color:var(--court)}
.well-row:first-child{border-top:none}
.well-l{font-size:14px;color:var(--ink)}
.well-spark{display:flex;justify-content:center}
.well-v{font-family:var(--display);font-weight:600;font-size:22px;text-align:right;color:var(--ink)}
.well-v small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:1px}
.next-list{display:flex;flex-direction:column;gap:10px}
.next-item{display:flex;gap:12px;align-items:center}

/* Registros */
.rec-list{display:flex;flex-direction:column;gap:8px}

.rec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer}

.rec-date{font-size:12.5px;color:var(--muted);display:flex;align-items:center}
.rec-title{font-weight:600;font-size:16px;margin-top:1px;overflow-wrap:anywhere}
.rec-sub{font-size:13px;color:var(--muted);margin-top:2px}

.rec-score{display:flex;align-items:center;gap:8px}

.rec-actions{display:flex;align-items:center;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.rec-comments{padding:6px 14px 14px;border-top:1px solid var(--line2)}
.modal-body .rec-comments{padding:12px 0 0}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;flex-shrink:0}
.pill.win{background:var(--ok-tint);color:var(--ok)}
.pill.loss{background:var(--bad-tint);color:var(--bad)}

.match-score{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em}
.match-meta{font-size:12.5px;color:var(--muted)}

/* B\xFAsqueda y filtros */
.filter-bar{display:flex;flex-direction:column;gap:8px}

.filter-search input{flex:1;background:transparent;border:none;padding:11px 0;min-height:44px}

.filter-selects select{flex-shrink:0;width:auto;max-width:210px;min-height:36px;padding:6px 12px;font-size:13.5px;font-weight:500;border-radius:20px;background:var(--card);border:1px solid var(--line)}

/* Torneos */

.week-day-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.cal-day-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}

.day-events-list{display:flex;flex-direction:column;gap:8px}
