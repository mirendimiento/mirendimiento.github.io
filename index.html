@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap');
/* \u2500\u2500 Sistema de dise\xF1o: "cancha dura" \u2500\u2500
   Fondo claro para leerse bien al sol en la cancha; azul de cancha como color de marca;
   arcilla solo para derrotas/alertas, verde para victorias/bien, \xE1mbar para precauci\xF3n. */
:root{
  --paper:#ECF0F2;--card:#FFFFFF;--ink:#0F2233;--muted:#5A6B79;--faint:#8A97A3;--line:#D8E0E5;--line2:#E8EDF0;
  --court:#1F5A8A;--court-deep:#163F63;--court-tint:#E3ECF4;--ball:#DCE65A;
  --ok:#2C7A55;--ok-tint:#E2F1E8;--warn:#B7800F;--warn-tint:#FBF0D6;--bad:#C2552B;--bad-tint:#F9E5DC;
  --r-sm:6px;--r:10px;--r-lg:16px;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif;
  /* alias usados dentro de la app */
  --bg:var(--paper);--bg2:var(--card);--chalk:var(--ink);--clay:var(--bad);--clay-l:var(--bad);--gold:var(--warn);--green:var(--ok);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);-webkit-tap-highlight-color:transparent}
.screen{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;min-height:100vh}
.screen.app{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Carga */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100vh;padding:20px;text-align:center}
.loader-dot{width:12px;height:12px;border-radius:50%;background:var(--ball);box-shadow:0 0 0 2px var(--court);animation:bounce .9s infinite ease-in-out}
.loader-txt{font-size:14px;color:var(--muted)}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* Acceso */
.auth-wrap{font-family:var(--body);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:var(--court);position:relative;overflow:hidden;padding:0 0 24px}
.auth-court{position:absolute;left:0;right:0;top:6%;width:100%;height:46%;color:rgba(255,255,255,.3);pointer-events:none}
.auth-box{position:relative;background:var(--card);border-radius:var(--r-lg);padding:26px 22px 22px;width:min(420px,calc(100vw - 32px));box-shadow:0 18px 40px rgba(8,25,40,.25)}
.auth-logo{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em;color:var(--ink)}
.auth-tag{font-size:14px;color:var(--muted);margin:6px 0 18px;max-width:34ch}
.auth-tabs{display:flex;background:var(--paper);border-radius:var(--r);padding:3px;margin-bottom:16px}
.auth-tab{flex:1;background:transparent;border:none;font-weight:600;font-size:14px;color:var(--muted);padding:9px;border-radius:8px;cursor:pointer}
.auth-tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,34,51,.12)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form .btn-primary{align-self:stretch;margin-top:4px}
.auth-err{background:var(--bad-tint);color:#8E3A19;padding:9px 12px;border-radius:var(--r-sm);font-size:13.5px}

/* Encabezado */
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(236,240,242,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line2)}
.hdr-who{display:flex;align-items:center;gap:11px;flex:1;min-width:0;cursor:pointer}
.hdr-avatar{width:40px;height:40px;border-radius:50%;background:var(--court);color:#fff;font-family:var(--display);font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;object-fit:cover}
.hdr-hi{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub::first-letter{text-transform:uppercase}
.hdr-out{background:none;border:none;font-size:13.5px;font-weight:600;color:var(--muted);padding:8px 4px;cursor:pointer}

.rk-shaft{fill:var(--court)}
.rk-grip{fill:#22313F}
.rk-wrap{stroke:#4A5B6B;stroke-width:2}
.rk-butt{fill:#22313F}
.rk-lead{fill:none;stroke:var(--muted);stroke-width:1.2}
.rk-dot{fill:var(--ball,#DCE65A);stroke:#22313F;stroke-width:1.5}
.rk-l{font-size:12px;font-weight:700;letter-spacing:.08em;fill:var(--muted)}
.rk-v{font-size:17px;font-weight:700;fill:var(--ink,#16232F);font-family:var(--display)}
.rk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.rk-cell{background:var(--paper);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rk-cell span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rk-cell b{font-size:15.5px;overflow-wrap:anywhere}
.rk-card{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:left;font:inherit;color:inherit}
.rk-card>div{flex:1;display:flex;flex-direction:column;gap:1px}
.rk-card small{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rk-card b{font-family:var(--display);font-size:20px;font-weight:600}
.rk-card span{font-size:13.5px;color:var(--muted)}
.rk-card em{font-style:normal;font-weight:700;color:var(--court)}
.rk-mini{width:34px;height:80px;flex:none}
.rk-mini .rk-frame{stroke-width:5}.rk-mini .rk-frame.thin{stroke-width:4}
.rk-hist{display:flex;flex-direction:column;gap:6px}
.rk-hrow-wrap{display:flex;gap:6px;align-items:center}
.rk-hrow{flex:1;display:grid;grid-template-columns:auto 1fr;column-gap:10px;row-gap:2px;align-items:baseline;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.rk-hrow span{font-size:13px;color:var(--muted)}
.rk-hrow small{grid-column:2;color:var(--muted);font-size:13px}
.rk-hrow.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court)}
.btn-edit{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:13.5px;font-weight:700;color:var(--court);cursor:pointer;margin-right:auto}
.body-edit{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:var(--r-sm);padding:12px}
.body-edit-t{font-family:var(--display);font-weight:600;font-size:18px}
.int-btns{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.int-btns button{min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer;padding:0}
.int-btns button.on{color:#fff}

.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;cursor:pointer}
.yn button.on{background:var(--court);border-color:var(--court);color:#fff}
.form-hint{font-size:13px;color:var(--muted)}

.section-label{font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink);padding-top:6px;border-top:1px solid var(--line2);margin-top:2px}
.section-label:first-child{border-top:none;padding-top:0;margin-top:0}
.ficha-title{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1}
.empty-note{font-size:14px;color:var(--muted);padding:4px 0}
.empty-note.centered{text-align:center;padding:28px 12px}
.log-latest{font-size:13.5px;color:var(--muted)}
.log-latest strong{color:var(--ink)}
.modal-toggle{display:flex;background:var(--paper);border-radius:var(--r);padding:3px}
.modal-opt{flex:1;padding:9px 0;background:transparent;border:none;font-weight:600;font-size:15px;color:var(--muted);border-radius:8px;cursor:pointer}
.modal-opt.on{background:var(--court);color:#fff}

/* Hoy */
.hoy{display:flex;flex-direction:column;gap:14px}
.hero{position:relative;overflow:hidden;background:var(--court);color:#fff;border-radius:var(--r-lg);padding:18px 18px 18px}
.hero.s-amarillo{background:#6B5A1E}
.hero.s-rojo{background:#7E3418}
.hero-court{position:absolute;right:-60px;top:-20px;width:300px;height:180px;color:rgba(255,255,255,.14);pointer-events:none}
.hero-top{position:relative;display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.hero-main{position:relative;display:flex;align-items:baseline;gap:6px;margin:4px 0 2px}
.hero-num{font-family:var(--display);font-weight:700;font-size:68px;line-height:.95;letter-spacing:-.01em}
.hero-of{font-family:var(--display);font-size:22px;opacity:.7}
.hero-state{margin-left:auto;align-self:center;font-weight:700;font-size:14px;background:var(--ball);color:var(--ink);padding:4px 10px;border-radius:20px}
.hero-state.solo{margin-left:0;font-size:15px}
.hero.s-amarillo .hero-state{background:#F4C75A}
.hero.s-rojo .hero-state{background:#FFB59A}
.hero-sub{position:relative;font-size:14px;line-height:1.45;opacity:.92;max-width:46ch}
.hero-cta{position:relative;margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:600;font-size:14px;padding:9px 14px;border-radius:var(--r-sm);cursor:pointer}
.hero-cta:hover{background:rgba(255,255,255,.22)}
.block{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.block-h h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1}
.cap{font-size:12.5px;color:var(--muted)}
.cap::first-letter{text-transform:uppercase}
.quiet{font-size:14px;color:var(--muted)}
.today-list{display:flex;flex-direction:column}
.today-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2)}
.today-item:first-child{border-top:none;padding-top:2px}

.today-title{font-weight:600;font-size:15.5px}
.today-notes{font-size:13.5px;color:var(--muted);margin-top:2px;white-space:pre-wrap}
.rank-strip{display:flex;align-items:flex-end;gap:0;padding:2px 4px;flex-wrap:wrap}
.rank-strip>div{display:flex;flex-direction:column;padding:0 16px 0 0;margin-right:16px;border-right:1px solid var(--line)}
.rank-strip>div:last-of-type{border-right:none}
.rank-strip span{font-size:12px;font-weight:600;color:var(--muted)}
.rank-strip strong{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.rank-strip em{font-style:normal;font-size:12px;color:var(--faint);margin-left:auto;align-self:flex-end;padding-bottom:4px}
.streak{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px}
.streak.w{background:var(--ok-tint);color:var(--ok)}
.streak.l{background:var(--bad-tint);color:var(--bad)}
.season{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.season-rec strong{display:block;font-family:var(--display);font-weight:700;font-size:56px;line-height:.9}
.season-rec i{font-style:normal;color:var(--faint);margin:0 2px}
.season-rec span{font-size:13px;color:var(--muted)}
.season-kv{display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);padding-left:16px}
.season-kv div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.season-kv dt{color:var(--muted)}
.season-kv dd{font-weight:600;text-align:right}
.score-list{display:flex;flex-direction:column;margin-top:4px}
.score-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.score-res{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;flex-shrink:0}
.score-row.w .score-res{background:var(--ok-tint);color:var(--ok)}
.score-row.l .score-res{background:var(--bad-tint);color:var(--bad)}
.score-main{flex:1;min-width:0}
.score-main div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-main small{font-size:12.5px;color:var(--muted)}
.score-num{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.well-rows{display:flex;flex-direction:column}
.well-row{display:grid;grid-template-columns:1fr 96px 64px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line2);color:var(--court)}
.well-row:first-child{border-top:none}
.well-l{font-size:14px;color:var(--ink)}
.well-spark{display:flex;justify-content:center}
.well-v{font-family:var(--display);font-weight:600;font-size:22px;text-align:right;color:var(--ink)}
.well-v small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:1px}
.next-list{display:flex;flex-direction:column;gap:10px}
.next-item{display:flex;gap:12px;align-items:center}
.next-date{width:46px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;border-left:3px solid var(--ec);padding:2px 0}
.next-date strong{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
.next-date span{font-size:11.5px;color:var(--muted);text-transform:capitalize}
.next-title{font-weight:600}
.next-item small{font-size:12.5px;color:var(--muted)}

/* Registros */
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-card{background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--ec,var(--court));border-radius:var(--r);overflow:hidden}
.rec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer}
.rec-head-main{min-width:0;flex:1}
.rec-date{font-size:12.5px;color:var(--muted);display:flex;align-items:center}
.rec-title{font-weight:600;font-size:16px;margin-top:1px;overflow-wrap:anywhere}
.rec-sub{font-size:13px;color:var(--muted);margin-top:2px}
.rec-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.rec-score{display:flex;align-items:center;gap:8px}
.rec-toggle{font-size:12.5px;font-weight:600;color:var(--court);white-space:nowrap}
.rec-detail{padding:4px 14px 12px;border-top:1px solid var(--line2)}
.modal-body .rec-detail{padding:0;border-top:none}
.rec-sec{padding-top:10px}
.rec-sec-t{font-family:var(--display);font-weight:600;font-size:16px;padding:4px 0 2px}
.rec-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px}
.rec-row:last-child{border-bottom:none}
.rec-row.wide{flex-direction:column;gap:3px}
.rec-l{color:var(--muted);flex-shrink:0}
.rec-v{text-align:right;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.rec-row.wide .rec-v{text-align:left;font-weight:400;line-height:1.5}
.rec-actions{display:flex;align-items:center;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.rec-comments{padding:6px 14px 14px;border-top:1px solid var(--line2)}
.modal-body .rec-comments{padding:12px 0 0}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;flex-shrink:0}
.pill.win{background:var(--ok-tint);color:var(--ok)}
.pill.loss{background:var(--bad-tint);color:var(--bad)}
.pill.dbl{background:var(--court-tint);color:var(--court)}
.match-score{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em}
.match-meta{font-size:12.5px;color:var(--muted)}

/* B\xFAsqueda y filtros */
.filter-bar{display:flex;flex-direction:column;gap:8px}
.filter-search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.filter-search input{flex:1;background:transparent;border:none;padding:11px 0;min-height:44px}
.filter-search input:focus{background:transparent}
.filter-x{background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px;padding:6px}
.filter-selects{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.filter-selects::-webkit-scrollbar{display:none}
.filter-selects select{flex-shrink:0;width:auto;max-width:210px;min-height:36px;padding:6px 12px;font-size:13.5px;font-weight:500;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.filter-selects select.on{border-color:var(--court);background:var(--court-tint);color:var(--court);font-weight:600}
.filter-status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.filter-status .btn-ghost{font-size:12.5px;padding:5px 10px}
.match-summary{display:grid;grid-template-columns:1.2fr 1fr 1fr;align-items:end;padding:4px 2px}
.match-summary>div{display:flex;flex-direction:column}
.match-summary strong{font-family:var(--display);font-weight:700;font-size:40px;line-height:.95}
.match-summary strong.gold{color:var(--court)}
.match-summary span{font-size:12.5px;color:var(--muted)}

/* Torneos */
.tournament-list{display:flex;flex-direction:column;gap:12px}
.tournament-group{display:flex;flex-direction:column;gap:8px}
.tournament-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 2px;cursor:pointer}
.tournament-info{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.tournament-name{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1}
.tournament-record{font-size:13px;font-weight:600;color:var(--court)}
.tournament-dates{font-size:12.5px;color:var(--muted);width:100%}
.tournament-toggle{font-size:12px;color:var(--muted)}
.tournament-matches{display:flex;flex-direction:column;gap:8px}

/* Rivales */
.scout-list{display:flex;flex-direction:column;gap:10px}
.scout-card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
button.scout-card{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
button.scout-card:hover{border-color:var(--court)}
.scout-tags{display:flex;flex-wrap:wrap;gap:6px}
.scout-tags span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--paper);color:var(--muted)}
.scout-tags span.good{background:var(--ok-tint);color:var(--ok)}
.scout-tags span.bad{background:var(--bad-tint);color:var(--bad)}
.h2h{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.h2h.w{background:var(--ok-tint);color:var(--ok)}.h2h.l{background:var(--bad-tint);color:var(--bad)}
.rival-form{display:flex;flex-direction:column;gap:12px}
.flag{margin-right:6px}
.profile-country{font-size:14px;font-weight:600;color:var(--muted)}
.scout-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.scout-rival{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1}
.scout-notes{font-size:14px;color:var(--ink);line-height:1.5;border-left:2px solid var(--line);padding-left:10px}
.scout-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Calendario */
.cal-card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:14px}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-month-label{font-family:var(--display);font-weight:600;font-size:22px}
.cal-grid-head{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.cal-dow{font-size:12px;font-weight:600;text-align:center;color:var(--faint);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{border-radius:8px;padding:6px 2px;min-height:46px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent}
.cal-cell.empty{cursor:default}
.cal-cell:not(.empty):hover{background:var(--paper)}
.cal-cell.today .cal-day-num{background:var(--ball);color:var(--ink);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cal-cell.selected{background:var(--court-tint);border-color:var(--court)}
.cal-day-num{font-size:14px;font-weight:500}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal-dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.9)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 4px;font-size:12.5px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.week-label{font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:10px}
.week-label::first-letter{text-transform:uppercase}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week-day{background:var(--paper);border:1px solid transparent;border-radius:8px;padding:7px 2px;cursor:pointer;min-height:62px;min-width:0;overflow:hidden}
.week-day.active{border-color:var(--court);background:var(--court-tint)}
.week-day.today .week-day-num{color:var(--court)}
.week-day-name{font-size:11px;color:var(--muted);text-align:center;text-transform:capitalize}
.week-day-num{font-family:var(--display);font-weight:600;font-size:20px;text-align:center;line-height:1.1}
.week-day-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.cal-day-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.cal-day-header .btn-primary{min-height:36px;padding:7px 12px!important;font-size:13.5px!important}
.day-events-list{display:flex;flex-direction:column;gap:8px}
.day-event{background:var(--paper);border-left:3px solid var(--ec);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.day-event.clickable{cursor:pointer}
.day-event.clickable:active{background:var(--line2)}
.day-event-type{font-size:12.5px;font-weight:600;color:var(--ec)}
.day-event-title{font-weight:600;font-size:15px}
.day-event-dates{font-size:12.5px;color:var(--muted)}
.day-event-notes{font-size:13.5px;color:var(--muted)}
.day-event-more{font-size:12.5px;font-weight:600;color:var(--court);margin-top:2px}
.day-event-by{font-size:12px;color:var(--muted);margin-top:2px}

/* Plan */
.plan-hint{background:var(--court-tint);border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.5;color:var(--court-deep)}
.plan-hint strong{color:var(--court-deep)}
.plan-week-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plan-week-title{text-align:center}
.plan-week-range{font-size:13px;color:var(--muted);margin-top:2px}
.plan-progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.plan-progress-bar{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.plan-progress-bar span{display:block;height:100%;background:var(--ok);border-radius:3px}
.plan-days{display:flex;flex-direction:column}
.plan-day{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.plan-day:first-child{border-top:none}
.plan-day.today .plan-day-label strong{background:var(--ball);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.plan-day-label{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);text-transform:capitalize}
.plan-day-label strong{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.2;color:var(--ink)}
.plan-day-items{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.plan-empty{font-size:13px;color:var(--faint);padding-top:6px}
.plan-item,.goal-item{display:flex;align-items:flex-start;gap:10px;background:var(--paper);border-radius:8px;padding:10px 12px}

.plan-check{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:1.5px solid #A9B6C1;background:var(--card);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s,border-color .15s}
.plan-check.on{background:var(--ok);border-color:var(--ok)}
.plan-item-main{flex:1;min-width:0}
.plan-item-title{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.plan-item-notes{font-size:13.5px;color:var(--muted);margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.plan-item-by{font-size:12px;color:var(--faint);margin-top:4px}
.goal-list{display:flex;flex-direction:column;gap:6px}
.day-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-pick{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.day-pick span{font-weight:700;font-size:14px}
.day-pick small{font-size:11px;color:var(--muted)}
.day-pick.on{background:var(--court);border-color:var(--court);color:#fff}
.day-pick.on small{color:rgba(255,255,255,.8)}
.day-quick{display:flex;flex-wrap:wrap;gap:6px}
.day-quick .btn-ghost{font-size:12.5px;padding:6px 10px}

/* Comentarios */
.cm-thread{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.cm-empty{font-size:13.5px;color:var(--faint)}
.cm-item{background:var(--paper);border-radius:10px 10px 10px 2px;padding:9px 12px;max-width:92%}
.cm-item.staff{background:var(--court-tint)}
.cm-meta{font-size:12px;color:var(--muted);margin-bottom:3px}
.cm-meta strong{color:var(--ink)}
.cm-text{font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.cm-input{display:flex;gap:8px;align-items:flex-end}
.cm-input textarea{flex:1}
.cm-input .btn-primary{align-self:flex-end}
.cm-badge{font-size:12px;font-weight:600;color:var(--court);white-space:nowrap}

/* Entrenador */
.team-summary{margin-bottom:14px}
.team-title{font-family:var(--display);font-weight:700;font-size:32px;line-height:1}
.team-sub{font-size:14px;color:var(--muted);margin-top:2px}
.coach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.coach-card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s}
.coach-card:hover{border-color:var(--court)}
.coach-card.alert{border-left:3px solid var(--bad)}
.coach-card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.coach-card-avatar{width:44px;height:44px;border-radius:50%;background:var(--court);color:#fff;font-family:var(--display);font-weight:600;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0;object-fit:cover}
.coach-card-name{font-weight:700;font-size:16.5px}
.coach-card-sub{font-size:13px;color:var(--muted)}
.coach-card-cta{font-size:13.5px;font-weight:600;color:var(--court);margin-top:4px}
.sem-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.alert-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.alert-chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--paper);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-chip.l3{background:var(--bad-tint);color:#9A3E17}
.alert-chip.l2{background:var(--warn-tint);color:#7A560A}
.coach-rows{display:flex;flex-direction:column;margin-bottom:6px}
.coach-row-i{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-top:1px solid var(--line2)}
.coach-row-i span{color:var(--muted);flex-shrink:0}
.coach-row-i strong{font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coach-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px;gap:10px;text-align:center}
.coach-empty-title{font-family:var(--display);font-weight:600;font-size:24px}
.coach-empty-sub{font-size:14.5px;color:var(--muted);max-width:340px;line-height:1.6}
.coach-empty-sub strong{color:var(--ink)}

/* Perfil */
.profile-header{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 16px 4px}
.profile-avatar-wrap{position:relative;width:104px;height:104px}
.profile-avatar-initials{width:104px;height:104px;border-radius:50%;background:var(--court);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:40px}
.profile-avatar-img{width:104px;height:104px;border-radius:50%;object-fit:cover}
.profile-avatar-edit{position:absolute;bottom:0;right:0;width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
.profile-name{font-family:var(--display);font-weight:700;font-size:28px;text-align:center;line-height:1.05}
.profile-role-badge{font-size:13px;font-weight:600;color:var(--court);background:var(--court-tint);padding:4px 12px;border-radius:20px}
.rank-badge{background:var(--paper);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;align-items:center}
.ranking-current{display:flex;gap:8px;flex-wrap:wrap}
.rank-label{font-size:12px;font-weight:600;color:var(--muted)}
.rank-num{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
.rank-date{font-size:12.5px;color:var(--muted)}
.team-hint{font-size:14px;color:var(--muted);line-height:1.55}
.coaches-list{display:flex;flex-direction:column;gap:8px}
.coach-row{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:8px;padding:10px 12px}
.coach-row-avatar{width:36px;height:36px;border-radius:50%;background:var(--ok);color:#fff;font-family:var(--display);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.coach-row-info{flex:1;min-width:0}
.coach-row-name{font-weight:600;font-size:15px}
.coach-row-role{font-size:12.5px;color:var(--muted)}
.add-coach-row{display:flex;gap:10px;align-items:flex-end}
.add-coach-input{flex:1}

/* Modales: en el tel\xE9fono suben desde abajo */
.modal-bg{position:fixed;inset:0;background:rgba(15,34,51,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.modal{background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;width:min(640px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:sheet .22s ease-out}
@keyframes sheet{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:700px){.modal-bg{align-items:center;padding:16px}.modal{border-radius:var(--r-lg)}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line2)}
.modal-title{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.1}
.modal-sub{font-size:13px;color:var(--muted);margin-top:2px}
.modal-body{padding:14px 18px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.ai-section{font-family:var(--display);font-weight:600;font-size:18px;margin-top:14px}
.ai-section:first-child{margin-top:0}
.ai-line{font-size:14.5px;line-height:1.6;color:#2B3D4C}

/* Otros heredados */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 11px;border-bottom:1px solid var(--line2);white-space:nowrap}
.match-stats{display:flex;gap:6px;flex-wrap:wrap}
.mstat{background:var(--paper);border-radius:6px;padding:5px 8px;text-align:center}
.mstat-l{font-size:11px;color:var(--muted)}
.mstat-v{font-weight:600;font-size:13.5px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .2s ease;z-index:200;white-space:nowrap}
.upd-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;padding:10px 16px;font-size:14px}
.upd-banner button{background:var(--ball);color:var(--ink);border:none;border-radius:20px;padding:6px 14px;font-weight:700;font-size:13.5px;cursor:pointer;flex-shrink:0}
.app-version{text-align:center;font-size:12px;color:var(--faint);padding:8px 0 4px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:760px){.content{padding:22px}.hero-num{font-size:80px}}
