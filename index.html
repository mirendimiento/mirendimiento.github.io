@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#0B1B2B;--bg2:#122435;--clay:#B5482F;--clay-l:#D86B4C;--chalk:#F2EFE9;--green:#4A6B5A;--gold:#C9A227;--line:rgba(242,239,233,0.1)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg)}
.screen{background:var(--bg);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100vh}
.loader-dot{width:10px;height:10px;border-radius:50%;background:var(--clay);animation:pulse 1s infinite ease-in-out}
.loader-txt{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.6}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:repeating-linear-gradient(0deg,transparent,transparent 79px,var(--line) 79px,var(--line) 80px)}
.auth-box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:28px;width:min(380px,92vw)}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.08em;display:flex;align-items:center;gap:8px;margin-bottom:20px}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px}
.auth-tab{flex:1;background:transparent;border:1px solid var(--line);color:var(--chalk);opacity:.5;font-family:'JetBrains Mono',monospace;font-size:11px;padding:8px;border-radius:4px;cursor:pointer;text-transform:uppercase}
.auth-tab.on{opacity:1;border-color:var(--clay);color:var(--clay-l)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-err{background:rgba(181,72,47,.15);border:1px solid rgba(181,72,47,.4);color:var(--clay-l);padding:8px 10px;border-radius:4px;font-size:12.5px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--clay);box-shadow:0 0 0 3px rgba(181,72,47,.22);flex-shrink:0}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em;line-height:1}
.brand-sub{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.5;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ticker{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--gold);display:flex;gap:6px}
.sep{color:var(--line)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--chalk);opacity:.6;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;padding:5px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn-ghost:hover{opacity:1}
.tabs{display:flex;gap:2px;padding:12px 18px 0;overflow-x:auto}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--chalk);opacity:.5;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tab.active{opacity:1;color:var(--clay-l);border-bottom-color:var(--clay)}
.content{padding:18px;max-width:940px;margin:0 auto}
.coach-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;text-align:center}
.coach-empty-title{font-family:'Bebas Neue',sans-serif;font-size:22px;opacity:.7}
.coach-empty-sub{font-size:13px;opacity:.5;max-width:340px;line-height:1.65}
.coach-empty-sub strong{color:var(--gold);opacity:1}
.coach-section-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);opacity:.8;margin-bottom:14px}
.coach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.coach-card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;transition:border-color .15s}
.coach-card:hover{border-color:var(--clay)}
.coach-card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.coach-card-avatar{width:38px;height:38px;border-radius:50%;background:var(--clay);color:var(--chalk);font-family:'Bebas Neue',sans-serif;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.coach-card-name{font-weight:600;font-size:15px}
.coach-card-sub{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.5;margin-top:2px}
.coach-card-stats{display:flex;gap:8px;margin-bottom:12px}
.coach-stat{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;text-align:center}
.coach-stat-l{font-family:'JetBrains Mono',monospace;font-size:8.5px;opacity:.45;text-transform:uppercase;margin-bottom:2px}
.coach-stat-v{font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1}
.coach-last-match{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:10px}
.coach-card-cta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--clay-l);opacity:.7}
.dash{display:flex;flex-direction:column;gap:18px}
.dash-top-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.dash-block{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:13px;display:flex;flex-direction:column;gap:7px}
.dash-block-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.5}
.ranking-current{display:flex;gap:8px;flex-wrap:wrap}
.rank-badge{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 11px;display:flex;flex-direction:column;align-items:center}
.rank-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;opacity:.45;letter-spacing:.06em}
.rank-num{font-family:'Bebas Neue',sans-serif;font-size:21px;color:var(--gold);line-height:1}
.rank-date{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.4}
.semaforo-row{display:flex;align-items:center;gap:9px}
.semaforo-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.semaforo-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em}
.streak-val{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.04em}
.dash-section-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:8px;margin-top:4px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat-card{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:6px;padding:11px 13px}
.stat-ey{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.07em;opacity:.5;text-transform:uppercase;margin-bottom:4px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1}
.stat-u{font-size:12px;opacity:.6;margin-left:2px}
.stat-sub{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.4;margin-top:3px}
.recent-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rblock{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:13px}
.rtitle{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.5;margin-bottom:10px}
.rrow{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rrow:last-child{border-bottom:none}
.rdate{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.5;width:42px;flex-shrink:0}
.rmain{flex:1}
.pill{font-family:'JetBrains Mono',monospace;font-size:9.5px;padding:2px 6px;border-radius:3px;flex-shrink:0}
.pill.win{background:rgba(74,107,90,.25);color:#8fc9ab}
.btn-add{width:100%;padding:12px;border-radius:8px;border:1px dashed rgba(216,107,76,.6);background:rgba(181,72,47,.1);color:var(--clay-l);font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.add-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.filter-bar{display:flex;flex-direction:column;gap:8px}
.filter-search{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.filter-search input{flex:1;background:transparent;border:none;outline:none;padding:10px 0;color:var(--chalk);font-size:14px;min-width:0}
.filter-x{background:none;border:none;color:var(--chalk);opacity:.5;cursor:pointer;font-size:13px;padding:4px}
.filter-selects{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-selects::-webkit-scrollbar{display:none}
.filter-selects select{flex-shrink:0;width:auto;max-width:200px;padding:7px 10px;font-size:12.5px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);color:var(--chalk)}
.filter-selects select.on{border-color:var(--clay);background:rgba(181,72,47,.15)}
.filter-status{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.8}
.filter-status .btn-ghost{font-size:10px;padding:4px 9px}
.match-summary{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.match-summary>div{display:flex;flex-direction:column;align-items:center;padding:12px 4px;border-right:1px solid var(--line)}
.match-summary>div:last-child{border-right:none}
.match-summary strong{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;font-weight:400}
.match-summary strong.gold{color:var(--gold)}
.match-summary span{font-size:10.5px;opacity:.55;margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.day-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-pick{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--chalk);cursor:pointer;font-family:inherit}
.day-pick span{font-weight:600;font-size:13px}
.day-pick small{font-size:10px;opacity:.55}
.day-pick.on{background:#6E86C9;border-color:#6E86C9}
.day-pick.on small{opacity:.9}
.day-quick{display:flex;flex-wrap:wrap;gap:6px}
.day-quick .btn-ghost{font-size:10px;padding:5px 9px}
.day-event-by{font-size:10.5px;opacity:.55;margin-top:3px}
.cm-input .fl,.cm-input textarea{width:100%}
.cm-thread{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.cm-empty{font-size:12px;opacity:.45}
.cm-item{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.cm-item.staff{border-left:3px solid var(--gold)}
.cm-meta{font-size:10.5px;opacity:.6;margin-bottom:3px}
.cm-meta strong{opacity:1;color:var(--chalk)}
.cm-text{font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.cm-input{display:flex;gap:8px;align-items:flex-end}
.cm-input textarea{flex:1}
.cm-badge{font-size:10.5px;color:var(--gold);white-space:nowrap}
.rec-comments{padding:4px 13px 12px;border-top:1px solid var(--line)}
.modal-body .rec-comments{padding:10px 0 0}
.team-summary{margin-bottom:14px}
.team-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.03em}
.team-sub{font-size:12.5px;opacity:.6}
.coach-card.alert{border-color:rgba(181,72,47,.55)}
img.coach-card-avatar{object-fit:cover}
.sem-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.alert-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.alert-chip{font-size:11px;padding:3px 8px;border-radius:12px;background:rgba(242,239,233,.06);border:1px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-chip.l3{background:rgba(181,72,47,.15);border-color:rgba(181,72,47,.45);color:var(--clay-l)}
.alert-chip.l2{background:rgba(201,162,39,.12);border-color:rgba(201,162,39,.4);color:var(--gold)}
.coach-rows{display:flex;flex-direction:column;margin-bottom:10px}
.coach-row-i{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.coach-row-i:last-child{border-bottom:none}
.coach-row-i span{opacity:.55;flex-shrink:0}
.coach-row-i strong{font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-hint{background:rgba(110,134,201,.1);border:1px solid rgba(110,134,201,.35);border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.plan-hint strong{color:var(--gold)}
.plan-week-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plan-week-title{text-align:center}
.plan-week-range{font-size:11.5px;opacity:.6;margin-top:2px}
.plan-progress{display:flex;align-items:center;gap:10px;font-size:11.5px;opacity:.85}
.plan-progress-bar{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.plan-progress-bar span{display:block;height:100%;background:var(--green)}
.plan-days{display:flex;flex-direction:column}
.plan-day{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-day:last-child{border-bottom:none}
.plan-day.today .plan-day-label{color:var(--clay-l)}
.plan-day-label{width:38px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;font-size:10.5px;text-transform:capitalize;opacity:.85}
.plan-day-label strong{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1}
.plan-day-items{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.plan-empty{font-size:12px;opacity:.3;padding-top:4px}
.plan-item,.goal-item{display:flex;align-items:flex-start;gap:10px;background:var(--bg);border:1px solid var(--line);border-left:3px solid #6E86C9;border-radius:6px;padding:8px 10px}
.plan-item.done,.goal-item.done{opacity:.6}
.plan-item.done .plan-item-title,.goal-item.done .plan-item-title{text-decoration:line-through}
.plan-check{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1.5px solid rgba(242,239,233,.4);background:transparent;color:var(--chalk);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.plan-check.on{background:var(--green);border-color:var(--green)}
.plan-item-main{flex:1;min-width:0}
.plan-item-title{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.plan-item-notes{font-size:12.5px;opacity:.75;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.plan-item-by{font-size:10.5px;opacity:.5;margin-top:3px}
